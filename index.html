<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nano Banana 2 — Песочница</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d0d0f;
    color: #e8e8ea;
    margin: 0;
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
  .card {
    background: #17171a;
    border: 1px solid #27272b;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
  input[type="password"], input[type="text"], textarea, select {
    width: 100%;
    background: #0d0d0f;
    border: 1px solid #2d2d32;
    border-radius: 8px;
    padding: 10px 12px;
    color: #e8e8ea;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 90px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #4a90e2; }
  .row { display: flex; gap: 12px; margin-bottom: 12px; }
  .row > div { flex: 1; }
  button {
    background: #4a90e2;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:hover:not(:disabled) { background: #5aa0f2; }
  button:disabled { background: #2d2d32; cursor: not-allowed; }
  .status { font-size: 13px; color: #888; margin-top: 12px; min-height: 18px; }
  .status.error { color: #ff6b6b; }
  .img-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .img-card {
    background: #111114;
    border: 1px solid #27272b;
    border-radius: 10px;
    overflow: hidden;
  }
  .img-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }
  .img-card .dl-btn {
    display: block;
    width: 100%;
    background: transparent;
    color: #888;
    border: none;
    border-top: 1px solid #27272b;
    padding: 8px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    transition: color 0.15s;
  }
  .img-card .dl-btn:hover { color: #4a90e2; }
  .saved-hint { font-size: 11px; color: #666; margin-top: 4px; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: #17171a;
    border: 1px solid #27272b;
    border-radius: 10px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    background: transparent;
    color: #888;
    border: none;
    padding: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 7px;
    width: auto;
  }
  .tab.active { background: #27272b; color: #e8e8ea; }
  .tab:hover:not(.active) { color: #ccc; }
  .pane { display: none; }
  .pane.active { display: block; }

  .upload-zone {
    border: 2px dashed #2d2d32;
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    color: #888;
    font-size: 13px;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: #4a90e2;
    background: #0d0d0f;
    color: #ccc;
  }
  .upload-zone input { display: none; }

  .thumbs { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .thumb {
    position: relative;
    width: 100px;
    height: 100px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2d2d32;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,0.75);
    color: white;
    border: none;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb .remove:hover { background: #ff6b6b; }
</style>
</head>
<body>
<div class="container">
  <h1>🍌 Nano Banana 2</h1>
  <div class="subtitle">Песочница для генерации и редактирования изображений через fal.ai API</div>

  <div class="card">
    <label>FAL API Key</label>
    <input type="password" id="apiKey" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx:xxxxxxxx...">
    <div class="saved-hint">Ключ хранится только в памяти этой вкладки и отправляется напрямую на api.fal.ai</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="generate">Generate (text → image)</button>
    <button class="tab" data-tab="edit">Edit (image → image)</button>
  </div>

  <div class="pane active" id="pane-generate">
    <div class="card">
      <label>Prompt</label>
      <textarea id="prompt-gen" placeholder="A futuristic cat astronaut floating in a neon-lit space station, cinematic lighting"></textarea>

      <div class="row" style="margin-top: 12px;">
        <div>
          <label>Aspect ratio</label>
          <select id="aspectRatio-gen">
            <option value="auto">auto</option>
            <option value="1:1" selected>1:1</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
            <option value="21:9">21:9</option>
            <option value="3:2">3:2</option>
            <option value="2:3">2:3</option>
          </select>
        </div>
        <div>
          <label>Resolution</label>
          <select id="resolution-gen">
            <option value="1K" selected>1K ($0.04)</option>
            <option value="2K">2K ($0.06)</option>
            <option value="4K">4K ($0.08)</option>
          </select>
        </div>
        <div>
          <label>Количество</label>
          <select id="numImages-gen">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
      </div>

      <button id="generateBtn" style="margin-top: 16px;">Сгенерировать</button>
      <div class="status" id="status-gen"></div>
    </div>
  </div>

  <div class="pane" id="pane-edit">
    <div class="card">
      <label>Референсы (до 3 фото)</label>
      <div class="upload-zone" id="uploadZone">
        <div>📎 Перетащи фото сюда или кликни чтобы выбрать</div>
        <div style="font-size: 11px; margin-top: 4px; color: #666;">JPG, PNG, WebP · до 3 штук</div>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </div>
      <div class="thumbs" id="thumbs"></div>

      <label style="margin-top: 16px;">Инструкция</label>
      <textarea id="prompt-edit" placeholder="replace the background with a sunset beach, keep the person exactly as is"></textarea>

      <div class="row" style="margin-top: 12px;">
        <div>
          <label>Aspect ratio</label>
          <select id="aspectRatio-edit">
            <option value="auto" selected>auto (как у исходника)</option>
            <option value="1:1">1:1</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
            <option value="21:9">21:9</option>
            <option value="3:2">3:2</option>
            <option value="2:3">2:3</option>
          </select>
        </div>
        <div>
          <label>Resolution</label>
          <select id="resolution-edit">
            <option value="1K" selected>1K ($0.08)</option>
            <option value="2K">2K ($0.12)</option>
            <option value="4K">4K ($0.16)</option>
          </select>
        </div>
        <div>
          <label>Количество</label>
          <select id="numImages-edit">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
      </div>

      <button id="editBtn" style="margin-top: 16px;">Отредактировать</button>
      <div class="status" id="status-edit"></div>
    </div>
  </div>

  <div class="img-grid" id="results"></div>
</div>

<script>
  const apiKeyInput = document.getElementById('apiKey');
  const results = document.getElementById('results');

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('pane-' + btn.dataset.tab).classList.add('active');
    });
  });

  // GENERATE
  const generateBtn = document.getElementById('generateBtn');
  const statusGen = document.getElementById('status-gen');

  async function generate() {
    const apiKey = apiKeyInput.value.trim();
    const prompt = document.getElementById('prompt-gen').value.trim();
    if (!apiKey) { setStatus(statusGen, 'Введи API-ключ', true); return; }
    if (!prompt) { setStatus(statusGen, 'Введи prompt', true); return; }

    generateBtn.disabled = true;
    setStatus(statusGen, 'Отправляю запрос...');
    try {
      const payload = {
        prompt: prompt,
        aspect_ratio: document.getElementById('aspectRatio-gen').value,
        resolution: document.getElementById('resolution-gen').value,
        num_images: parseInt(document.getElementById('numImages-gen').value),
        output_format: 'png'
      };
      const images = await callFal('fal-ai/nano-banana-2', payload, apiKey, statusGen);
      renderResults(images, prompt);
      setStatus(statusGen, `✓ Готово (${images.length} шт.)`);
    } catch (err) {
      console.error(err);
      setStatus(statusGen, 'Ошибка: ' + err.message, true);
    } finally {
      generateBtn.disabled = false;
    }
  }

  // EDIT
  const editBtn = document.getElementById('editBtn');
  const statusEdit = document.getElementById('status-edit');
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const thumbs = document.getElementById('thumbs');
  const uploadedImages = [];

  uploadZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('dragover');
  });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });

  async function handleFiles(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    for (const file of files) {
      if (uploadedImages.length >= 3) {
        setStatus(statusEdit, 'Максимум 3 референса', true);
        break;
      }
      const dataUrl = await readFileAsDataURL(file);
      uploadedImages.push({ dataUrl, name: file.name });
    }
    fileInput.value = '';
    renderThumbs();
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderThumbs() {
    thumbs.innerHTML = '';
    uploadedImages.forEach((img, i) => {
      const div = document.createElement('div');
      div.className = 'thumb';
      const imgEl = document.createElement('img');
      imgEl.src = img.dataUrl;
      imgEl.title = img.name;
      div.appendChild(imgEl);
      const rm = document.createElement('button');
      rm.className = 'remove';
      rm.textContent = '×';
      rm.onclick = () => {
        uploadedImages.splice(i, 1);
        renderThumbs();
      };
      div.appendChild(rm);
      thumbs.appendChild(div);
    });
  }

  async function edit() {
    const apiKey = apiKeyInput.value.trim();
    const prompt = document.getElementById('prompt-edit').value.trim();
    if (!apiKey) { setStatus(statusEdit, 'Введи API-ключ', true); return; }
    if (uploadedImages.length === 0) { setStatus(statusEdit, 'Загрузи хотя бы одно фото', true); return; }
    if (!prompt) { setStatus(statusEdit, 'Введи инструкцию', true); return; }

    editBtn.disabled = true;
    setStatus(statusEdit, 'Отправляю запрос...');
    try {
      const payload = {
        prompt: prompt,
        image_urls: uploadedImages.map(img => img.dataUrl),
        aspect_ratio: document.getElementById('aspectRatio-edit').value,
        resolution: document.getElementById('resolution-edit').value,
        num_images: parseInt(document.getElementById('numImages-edit').value),
        output_format: 'png'
      };
      const images = await callFal('fal-ai/nano-banana-2/edit', payload, apiKey, statusEdit);
      renderResults(images, prompt);
      setStatus(statusEdit, `✓ Готово (${images.length} шт.)`);
    } catch (err) {
      console.error(err);
      setStatus(statusEdit, 'Ошибка: ' + err.message, true);
    } finally {
      editBtn.disabled = false;
    }
  }

  // SHARED
  async function callFal(endpoint, payload, apiKey, statusEl) {
    const submitRes = await fetch(`https://queue.fal.run/${endpoint}`, {
      method: 'POST',
      headers: {
        'Authorization': `Key ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    if (!submitRes.ok) {
      const err = await submitRes.text();
      throw new Error(`${submitRes.status}: ${err}`);
    }

    const submitData = await submitRes.json();
    const requestId = submitData.request_id;
    // fal.ai возвращает готовые URL для polling и получения результата
    const statusUrl = submitData.status_url;
    const responseUrl = submitData.response_url;
    setStatus(statusEl, `В очереди (${requestId.slice(0, 8)}...)`);

    let attempts = 0;
    while (attempts < 120) {
      await new Promise(r => setTimeout(r, 1500));
      const statusRes = await fetch(statusUrl, {
        headers: { 'Authorization': `Key ${apiKey}` }
      });
      const statusData = await statusRes.json();

      if (statusData.status === 'COMPLETED') {
        setStatus(statusEl, 'Готово, загружаю результат...');
        break;
      } else if (statusData.status === 'IN_PROGRESS') {
        setStatus(statusEl, 'Генерирую... 🎨');
      } else if (statusData.status === 'IN_QUEUE') {
        setStatus(statusEl, `В очереди (позиция ${statusData.queue_position ?? '?'})`);
      } else if (statusData.status === 'FAILED') {
        throw new Error('Запрос провалился: ' + JSON.stringify(statusData));
      }
      attempts++;
    }

    const resultRes = await fetch(responseUrl, {
      headers: { 'Authorization': `Key ${apiKey}` }
    });
    const resultData = await resultRes.json();

    if (!resultData.images || resultData.images.length === 0) {
      throw new Error('В ответе нет картинок: ' + JSON.stringify(resultData));
    }
    return resultData.images;
  }

  function renderResults(images, prompt) {
    images.forEach((img) => {
      const card = document.createElement('div');
      card.className = 'img-card';

      const imgEl = document.createElement('img');
      imgEl.src = img.url;
      imgEl.alt = prompt.slice(0, 60);
      imgEl.title = prompt;
      card.appendChild(imgEl);

      const dlBtn = document.createElement('button');
      dlBtn.className = 'dl-btn';
      dlBtn.textContent = '⬇ Скачать';
      dlBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = img.url;
        a.download = 'nano_banana_' + Date.now() + '.png';
        a.click();
      };
      card.appendChild(dlBtn);

      results.prepend(card);
    });
  }

  function setStatus(el, msg, isError = false) {
    el.textContent = msg;
    el.className = 'status' + (isError ? ' error' : '');
  }

  generateBtn.addEventListener('click', generate);
  editBtn.addEventListener('click', edit);
  document.getElementById('prompt-gen').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generate();
  });
  document.getElementById('prompt-edit').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) edit();
  });
</script>
</body>
</html>
